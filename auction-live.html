/*Reducing the image size */

function optimizeImage(url){
  if(!url) return "";
  if(!url.includes("res.cloudinary.com")) return url;
  return url.replace("/upload/","/upload/q_auto,f_auto/");
}


/* 🔊 LIVE SOLD VOICE ANNOUNCEMENT */

function speak(text){
  if(!('speechSynthesis' in window)) return;

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function announceLiveSale(player){
  const amount = Number(player.soldAmount || 0).toLocaleString("en-IN");
  const message =
    player.name + " sold to " +
    player.soldTeam + " for " +
    amount + " rupees";

  speak(message);
}

onSnapshot(collection(db,"players"), snap => {

function loadImageAsBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous"; // IMPORTANT for Cloudinary
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL("image/jpeg"));
    };
    img.onerror = reject;
   img.src = optimizeImage(url);

  });
}

/*   Downloading the team PDF files    */


window.downloadPDF = async (team) => {

  const list = soldPlayers.filter(
    p => p.soldTeam.replace(/'/g,"") === team
  );

  if (!list.length) {
    alert("No players in this team");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  let y = 10;
  pdf.setFontSize(16);
  pdf.text(team, 10, y);
  y += 10;

  for (const p of list) {
    try {
      const imgData = await loadImageAsBase64(p.photo);

      pdf.addImage(imgData, "JPEG", 10, y, 25, 25);
      pdf.setFontSize(12);
      pdf.text(`Name: ${p.name}`, 40, y + 8);
      pdf.text(`Amount: ₹${p.soldAmount}`, 40, y + 16);

      y += 35;

      if (y > 260) {
        pdf.addPage();
        y = 10;
      }
    } catch (e) {
      console.error("Image load failed", e);
    }
  }

  // pdf.save(team + ".pdf");

  const blob = pdf.output("blob");
const url = URL.createObjectURL(blob);

// 🔍 Detect mobile WebView
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

if (isMobile) {
  // 📱 Mobile → open PDF (user can download/share)
  window.open(url, "_blank");
} else {
  // 💻 Desktop → direct download
  const a = document.createElement("a");
  a.href = url;
  a.download = team + ".pdf";
  a.click();
}

setTimeout(() => URL.revokeObjectURL(url), 3000);
};

window.movePlayer = async function(playerId, newTeam){

  if(!newTeam) return;

  if(localStorage.getItem("isAdmin") !== "true"){
    alert("Not authorized ❌");
    return;
  }

  try{

    const PLAYER_LIMIT = 11;

    const snap = await getDocs(collection(db,"players"));

    let count = 0;

    snap.forEach(d=>{
      const data = d.data();
      if(data.sold && data.soldTeam === newTeam){
        count++;
      }
    });

    if(count >= PLAYER_LIMIT){
      alert("❌ Team already full");
      return;
    }

    await updateDoc(doc(db,"players", playerId),{
      soldTeam:newTeam
    });

    alert("✅ Player moved successfully");

  }catch(e){
    console.error(e);
    alert("❌ Move failed");
  }
};
